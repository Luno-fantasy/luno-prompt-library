<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3eee8">
<title>オリジナルキャラクター | Luno</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
<header class="site-head">
  <a class="brand" href="index.html">LUNO</a>
  <a class="head-link" href="index.html">COLLECTIONS</a>
</header>

<a class="back" href="index.html">Collections</a>
<section class="collection-hero">
  <span class="eyebrow">Original Character Collection</span>
  <h1>オリジナル<br>キャラクター</h1>
  <p>代理ちゃんや創作キャラクターの容姿・衣装プロンプトをまとめるコレクション。</p>
</section>

<div class="toolbar">
  <input class="search" type="search" placeholder="名前・衣装・雰囲気から検索" oninput="filterTiles(this)">
</div>

<section class="gallery">
  <button class="prompt-tile"
    data-search="代理ちゃん オリジナル 看板キャラ 仙侠 中華幻想 黒 紅 金 1girl, solo, short hair, high bun, black hair, white streaked hair, brown eyes, hime cut, earrings, refined xianxia-inspired dress, black, crimson and gold palette, layered ceremonial skirt, ornamental knot buttons, silk drapery, jade pendants, luxurious embroidery, noble cultivation world aesthetic, elegant fantasy costume, highly detailed fashion concept art masterpiece, best quality, high quality, highres, ultra detailed, sharp focus, clean lineart, detailed fabric, intricate embroidery, soft cinematic lighting"
    data-prompt="{&quot;title&quot;: &quot;代理ちゃん&quot;, &quot;tag&quot;: &quot;Avatar / Xianxia / Original&quot;, &quot;female&quot;: &quot;1girl, solo, short hair, high bun, black hair, white streaked hair, brown eyes, hime cut, earrings, refined xianxia-inspired dress, black, crimson and gold palette, layered ceremonial skirt, ornamental knot buttons, silk drapery, jade pendants, luxurious embroidery, noble cultivation world aesthetic, elegant fantasy costume, highly detailed fashion concept art&quot;, &quot;femaleImage&quot;: &quot;images/original_01_female.jpg&quot;, &quot;qualityTags&quot;: &quot;masterpiece, best quality, high quality, highres, ultra detailed, sharp focus, clean lineart, detailed fabric, intricate embroidery, soft cinematic lighting&quot;}"
    onclick="openPrompt(this)">
    <div class="tile-visual">
      <img src="images/original_01_female.jpg" alt="代理ちゃん">
    </div>
    <div class="tile-title">代理ちゃん</div>
    <div class="tile-tag">Avatar / Xianxia / Original</div>
  </button>
</section>

<div class="empty" id="emptyState">該当するプロンプトがありません。</div>
<footer class="footer">LUNO PROMPT ARCHIVE — PRIVATE COLLECTION</footer>
</main>

<div class="modal" id="promptModal">
  <div class="modal-backdrop" onclick="closePrompt()"></div>
  <section class="modal-sheet">
    <div class="modal-grip"></div>
    <button class="modal-close" onclick="closePrompt()" aria-label="閉じる">×</button>
    <div class="modal-image-wrap"><img class="modal-image" id="modalImage" alt=""></div>
    <div class="modal-sub" id="modalSub"></div>
    <h2 id="modalTitle"></h2>
    <div class="gender-tabs" id="genderTabs"></div>

    <div class="quality-label">Character Prompt</div>
    <div class="prompt-box" id="promptText"></div>
    <button class="copy" id="copyButton" onclick="copyPrompt()">Promptをコピー</button>

    <div class="quality-section" id="qualitySection">
      <div class="quality-label">Quality Tags</div>
      <div class="prompt-box" id="qualityText"></div>
      <button class="copy-secondary" id="qualityCopyButton" onclick="copyQualityTags()">品質タグをコピー</button>
    </div>
  </section>
</div>

<script src="app.js"></script>
</body>
</html>
