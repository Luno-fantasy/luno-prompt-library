  <button class="prompt-tile" data-search="Your Color オリジナルカラー 色 カラーカード" data-prompt='{"title":"Your Color","tag":"Color / Identity / Editorial","prompt":"【テーマ｜この人を「色」にすると何色？】\n\nこれまでの会話から読み取れる人物の性格・価値観・雰囲気・好きなもの・考え方・個性・世界観を総合的に解釈し、\n\n「この人を色にすると何色か？」\n\nを1つのオリジナルカラーとして決めてください。\n\n人物写真だけから判断するのではなく、これまでの会話から感じ取れる「その人らしさ」を最優先してください。\n\nまず内部で、\n・メインカラー\n・カラーコード\n・オリジナルの色名\n・補助カラー2〜4色\n・それぞれの色が表す人物像\nを考えてください。\n\n色は既存の色名に限定せず、その人物だけのオリジナルカラー名を付けても構いません。\n\nただし、完成画像では説明を詰め込みすぎず、\n「診断結果」ではなく\n「その人自身を1枚の色として表現したアート作品」\nにしてください。\n\n【デザイン】\n\n・縦長9:16\n・SNSのストーリーやプロフィール投稿に使いやすいサイズ感\n・ミニマル\n・余白を多めにする\n・ごちゃごちゃさせない\n・高級感のあるファッション誌、香水広告、カラー診断カードのような雰囲気\n・人物そのものを必ず描く必要はない\n・その人の色を象徴する抽象的なオブジェクトを中央に1つ配置\n・光、ガラス、水、煙、鉱石など、その色に合う質感を自由に選ぶ\n・背景や装飾も、その人の色に合わせて決める\n・過度な装飾や大量のモチーフは避ける\n・洗練された現代的なデザイン\n・色そのものが主役\n\n【文字】\n\n上部：\n「YOUR COLOR」\n\n中央：\nAIが選んだオリジナルカラー名\n\nその下：\n英語表記を小さく添える\n\nさらに短いキャッチコピーを1〜2行。\n\nその人物を表す言葉を、\nその人の会話から感じ取った内容で簡潔に表現する。\n\n下部には、\nメインカラー＋補助カラーのカラースウォッチを3〜5色程度配置。\n\n各スウォッチには、\n・カラーコード\n・色名\n・その色が表す人物の要素\nを簡潔に表示。\n\n文章量は少なくする。\n\n【重要】\n\n「その人は○○色です」という一般的な性格診断のようなデザインにはしない。\n\n会話から感じ取った、\nその人だけのクセ、魅力、価値観、空気感、好きなもの、個性などを色に変換する。\n\n万人受けする無難な色を選ぶのではなく、\n「この人だからこの色」\nと思える色を選ぶ。\n\n明るい色でも暗い色でも構わない。\n複数の色を組み合わせても構わない。\n\n色を決める理由は内部で十分に考えたうえで、\n完成画像では説明を最小限にする。\n\n見た瞬間に、\n「この色、なんか自分っぽい」\nと思えるような、\nその人だけのカラーカードを作成してください。\n\n全体として、\nシンプル・おしゃれ・少し特別感があり、\nSNSにそのまま載せたくなるような完成度にしてください。","image":"images/chatgpt_01.jpg"}' onclick="openPrompt(this)">

  <button class="prompt-tile" data-search="Name-Born Flower 名前 架空の花 植物図鑑" data-prompt='{"title":"Name-Born Flower","tag":"Flower / Name / Botanical","prompt":"入力された「名前」から連想し、その名前だけの完全オリジナルの架空の花を1種類デザインして画像生成する。\n\n【入力】\n名前：\n\n名前の響き・文字・意味・印象から、花の色、花弁、蕊、葉、茎、模様、質感を自由に考案する。\n実在する花の再現ではなく、「本当に存在しそうなのに見たことがない花」にする。\n\nAIが名前から「オリジナル花名・読み仮名・花言葉3つ・短い解説・キャッチコピー」も考案する。\n\n【固定レイアウト】\n縦長の植物図鑑×フラワーブランド広告風。\n中央〜やや右に一輪の花を配置。花冠は横幅35〜45％程度に抑え、茎と葉まで見せ、広い余白を残す。\n\n左上：名前＋読み仮名＋オリジナル花名\n左中央：花言葉3つ\n右上：短い縦書きコピー\n左下：短い詩的コピー\n\n最下部に横長の図鑑パネル。\n左に花名＋短い解説、右に正方形のクローズアップ3枚を横並び。\n「PETAL（花弁）／DETAIL（特徴）／LEAF（葉）」と短い説明を付ける。\n\n背景は花に合わせた2〜3色の柔らかなグラデーション。風景や具体的な背景物は入れない。\n\n全体はシンプル、繊細、透明感のあるデザイン。細い外枠と広い余白を使い、装飾は最小限。\n幻想性は宝石やチェーンではなく、花そのものの形・色・模様・質感で表現する。\n\n花や配色は名前ごとに自由に変えるが、上記レイアウトは必ず維持する。","image":"images/chatgpt_02.jpg"}' onclick="openPrompt(this)">

  <button class="prompt-tile" data-search="Your Fantasy Creature USER 空想動物 キャラクター" data-prompt='{"title":"Your Fantasy Creature","tag":"Creature / Personality / Character","prompt":"【テーマ｜USERを空想の動物にするなら？】\n\nこれまでの会話から読み取れるUSERの性格・価値観・考え方・創作の傾向・好きな世界観・独特なこだわり・雰囲気を総合的に解釈し、\n\n「もしUSERという人間が、この世界に存在する完全オリジナルの空想動物だったら？」\nというテーマで1匹の空想動物を作ってください。\n\nただの動物診断ではなく、USERの特徴を元にした「この動物だからこそ成立する生態・性格・名前」を考えてください。\n\n重要\n情報を詰め込みすぎず、SNSにそのまま投稿したくなるようなおしゃれなキャラクター紹介カードとしてまとめてください。\n\n主役はあくまで空想動物そのもの。\n\n画面いっぱいにその動物が存在し、見た瞬間に「何この生き物？」と興味を引くデザインにしてください。\n\n動物について考えること\n\n以下の内容を中心に、必要なものだけ自然に組み合わせてください。\n\n・完全オリジナルの名前\n・一言で分かる性格\n・特徴的な生態や習性\n・何を好むのか\n・何を嫌うのか\n・ちょっと変わった能力や特徴\n・飼育や接し方についての短い注意書き\n・USERらしさが表れる一文\n\n項目を大量に並べるのではなく、短い文章や小さなラベルとして散りばめるようにしてください。\n\n説明文よりも、キャラクターそのものから個性が伝わる構成にしてください。これまでの会話から感じ取れる要素をその動物独自の性格や生態に変換してください。\n\nありがちな「人懐っこい」「寂しがり屋」「優しい」だけでは終わらせず、少し奇妙で、覚えやすく、名前を見ただけでも気になるような存在にしてください。\n\nビジュアル構成\n・縦長のスマートフォン待ち受け向け構図\n・動物を画面の大部分に配置\n・キャラクターが一目で分かる大きさ\n・全身または全身に近い構図\n・背景は動物の世界観を補助する程度にする\n・名前は目立つ位置に配置\n・性格や生態の短い説明を数個だけ添える\n・図鑑ページのように情報を敷き詰めない\n・ポスターやキャラクター設定画のような洗練されたレイアウト\n・SNSで投稿したくなる完成された一枚絵\n・過度な装飾は避ける\n\n動物は完全な生物として描写し、人間の姿や人型の身体にはしないでください。\n\n設定資料を読むための画像ではなく、まず動物に目が行き、あとから文字を読んで、この生き物なんなんだ……となる画像を目指してください。","image":"images/chatgpt_03.jpg"}' onclick="openPrompt(this)">

  <button class="prompt-tile" data-search="You as a Cake ホールケーキ ティーテーブル パティスリー" data-prompt='{"title":"You as a Cake","tag":"Cake / Personality / Patisserie","prompt":"これまでの会話や入力された人物像から、その人の性格・価値観・好み・雰囲気・個性・世界観を総合的に読み取り、「その人自身を一台のホールケーキにしたら？」という発想でデザインしてください。\n\n人物は描かず、ケーキそのものとティーテーブルで表現してください。\n\n3〜4段の豪華な多段ホールケーキ。\n色、形、クリーム、スポンジ、フルーツ、花、砂糖細工、結晶、光などを、その人物に最も似合うよう自由に決定してください。\n\n現実の高級パティスリーにありそうな素材だけでなく、幻想的・架空の食材も使用して構いません。\nその人物を象徴する「意外な素材」や「少し変わった仕掛け」を1〜3個入れてください。\n\nケーキの周囲には、ティーカップ、ティーポット、花、キャンドル、本、アクセサリー、アンティーク小物など、その人物の世界観を感じる小道具を配置してください。\n\n背景も含めて一つの世界として作り込み、ケーキに似合う高級なティーサロン、洋館、庭園、図書室、異世界などの空間を自由に選んでください。\n\n「美しい」「可愛い」だけで終わらせず、その人物特有の矛盾や違和感も一つ取り入れてください。\n例：美しいのに少し不穏、可愛いのに毒っぽい、豪華なのにどこか寂しい、現実的なのに一部分だけ幻想的、など。\n\n画像は縦長の高級パティスリー広告・コンセプトアート風。\nケーキを主役にしつつ、背景や小道具まで細密に描写してください。\n\n画像内には、その人物専用の\n「ケーキ名」\n「短いメインコピー」\n「短いサブコピー」\nを上品な広告文字として入れてください。\n\n人物をケーキそのものに変換するような感覚で、唯一無二の一台に仕上げてください。","image":"images/chatgpt_04.jpg"}' onclick="openPrompt(this)">

  <button class="prompt-tile" data-search="Character Lipstick Ad キャラクター リップ 高級コスメ 広告" data-prompt='{"title":"Character Lipstick Ad","tag":"Character / Lipstick / Luxury Ad","prompt":"参照画像キャラクターの顔・髪型・目の形・表情・体格は変更しない。元キャラクター本人として認識できる状態を維持する。\n\nキャラクターを高級コスメブランドの広告モデルとして描く。\n\n髪色・瞳色・衣装色に調和する限定リップスティックを1種類のみデザインする。\n\nリップ以外のコスメは表示しない。\n\nリップを主役商品として大きく配置する。\n\nリップ容器はキャラクター専用デザイン。\nキャラクターの色彩や世界観を反映した上品で高級感のある装飾。\n\nキャラクターは実際にリップを唇へ塗っている瞬間を描く。\n\nリップが唇に触れている状態を明確に描写する。\n\n持つだけ、見つめるだけのポーズは禁止。\n\n参照画像と同じポーズは禁止。\n\n自然な広告撮影風ポーズ。\n\n顔とリップ使用シーンが同時に見える構図。\n\n上半身中心。\n\n唇、表情、手元を美しく見せる。\n\n高級ブランドの広告ポスター風。\n\n商品名や広告テキストを洗練されたデザインとして自然に配置する。\n\n背景はキャラクターの色彩や雰囲気に調和したラグジュアリーな空間。\n\n洗練された照明演出。","image":"images/chatgpt_05.jpg"}' onclick="openPrompt(this)">

  <button class="prompt-tile" data-search="Character Eyeshadow Ad キャラクター アイシャドウ 高級コスメ 広告" data-prompt='{"title":"Character Eyeshadow Ad","tag":"Character / Eyeshadow / Luxury Ad","prompt":"参照画像キャラクターの顔・髪型・目の形・表情・体格は変更しない。元キャラクター本人として認識できる状態を維持する。\n\nキャラクターを高級コスメブランドの広告モデルとして描く。\n\n髪色・瞳色・衣装色に調和する限定アイシャドウを1種類のみデザインする。\n\nアイシャドウ以外のコスメは表示しない。\n\nアイシャドウを主役商品として大きく配置する。\n\nアイシャドウパレットとパッケージはキャラクター専用デザイン。\n\nキャラクターの色彩や世界観を反映した上品で高級感のある装飾。\n\nキャラクターは実際にアイシャドウをまぶたへ塗っている瞬間を描く。\n\nブラシまたは指先がまぶたに直接触れている。\n\n塗布している側のまぶたは自然に閉じる。\n\n反対側の目は開いている。\n\nアイシャドウをまぶたへ乗せている途中の瞬間。\n\nアイシャドウを馴染ませている自然なメイク動作。\n\n塗布した部分に発色とラメ感が見える。\n\nブラシまたは指先とまぶたの接触を明確に描写する。\n\nアイシャドウ塗布動作を最優先。\n\n持つだけ、見つめるだけ、静止ポーズは禁止。\n\n参照画像と同じポーズは禁止。\n\n自然な広告撮影風ポーズ。\n\n顔とアイシャドウ使用シーンが同時に見える構図。\n\n上半身中心。\n\n目元、表情、手元を美しく見せる。\n\n高級ブランドの広告ポスター風。\n\n商品名や広告テキストを洗練されたデザインとして自然に配置する。\n\n文字配置やタイポグラフィは画像ごとに変化させる。\n\n固定の雑誌ロゴや同一レイアウトを繰り返さない。\n\n背景はキャラクターの色彩や雰囲気に調和したラグジュアリーな空間。\n\nキャラクターのモチーフや世界観を反映した上品な演出。\n\n洗練された照明演出。","image":"images/chatgpt_06.jpg"}' onclick="openPrompt(this)">

  <button class="prompt-tile" data-search="Your Scent 香水 フレグランス 広告" data-prompt='{"title":"Your Scent","tag":"Fragrance / Identity / Editorial","prompt":"あなたの香水プロンプト\n\n【テーマ｜この人を「香水」にすると、どんな香り？】\n\nこれまでの会話から読み取れる人物の性格・価値観・雰囲気・好きなもの・考え方・美意識・矛盾・個性・世界観を総合的に解釈し、\n\n「もし、この人そのものを一本の香水として表現するなら？」\n\nという発想で、その人だけのオリジナルフレグランスを設計してください。\n\n実在する香水に当てはめるのではなく、\n会話から感じ取れる「その人らしさ」を香りへ翻訳してください。\n\nまず内部で、\n\n・香水名\n・英語名\n・香調\n・トップノート\n・ミドルノート\n・ラストノート\n・香水そのものの色\n・ボトルの素材と形\n・その香りが表す人物像\n\nを十分に考えてください。\n\n香料は実在するものだけに限定しません。\n\n雨上がりの石、古い本の紙、夜明け前の空気、熱を持った金属、冷えたガラス、煙、濡れた木、赤い果実など、\n人物像に必要であれば情景や感覚そのものを香りとして扱って構いません。\n\nただし完成画像は、\n「あなたは○○タイプです」という診断画像にはしないでください。\n\nあくまで、\n\n「この人物が本当に存在する香水ブランドから一本の香水として発売された」\n\nような完成された広告ビジュアルにしてください。\n\n【デザイン】\n\n・縦長9:16\n・SNSストーリー、プロフィール投稿向け\n・高級フレグランス広告\n・現代的なファッション誌の1ページのような雰囲気\n・ミニマル\n・余白を大きく使う\n・色数を絞る\n・人物そのものは描かなくてもよい\n・中央にオリジナル香水のボトルを1本だけ配置\n・人物像に合わせ、ガラス、金属、鉱石、陶器、液体、煙、霧など素材を選ぶ\n・香水瓶そのものにも、その人物の性格が現れているようにする\n・背景は香りの世界観を示唆する程度\n・大量の花や小物で説明しすぎない\n・一見して高級感があり、実在ブランドの広告のような完成度\n・美しいだけでなく、少しだけ本人特有の違和感や癖を残す\n\n【香りの設計】\n\n万人受けする無難な香りにはしないでください。\n\n甘い／苦い\n冷たい／熱い\n清潔／退廃\n透明／濃密\n柔らかい／鋭い\n\nなど、人物の中に同時に存在する矛盾も香りとして表現してください。\n\nトップノートでは第一印象、\nミドルノートでは親しくなったあとに見える性格、\nラストノートでは長く付き合った人だけが知る核、\n\nという構造で考えてください。\n\n【文字】\n\n上部：\n\n「YOUR SCENT」\n\n中央：\n\nAIが考えたオリジナル香水名\n\nその下に英語名を小さく配置。\n\nさらに、\nその人物を表す短いコピーを1〜2行。\n\nコピーは人物を説明する文章ではなく、\nその香水の広告コピーとして成立する言葉にしてください。\n\n例：\n\n「静かなものほど、深く燃える。」\n\nのように、\n短く、余韻を残してください。\n\n【下部】\n\nトップ／ミドル／ラストの香調を簡潔に配置。\n\n例：\n\nTOP\nベルガモット / 冷たい雨 / 赤い果実\n\nHEART\nローズ / インク / 焦がした木\n\nBASE\nアンバー / 煙 / 古い紙\n\n程度の短い表記にしてください。\n\n説明文を大量に載せないでください。\n\n【重要】\n\n単純に、\n「優しい人だから花の香り」\n「情熱的だからローズ」\nのような一対一の性格診断にはしないでください。\n\nこれまでの会話の中にある、\n\n・本人特有の価値観\n・矛盾\n・美意識\n・好き嫌い\n・言葉の癖\n・知性\n・危うさ\n・ユーモア\n・静けさ\n・熱\n・世界の見方\n\nまで読み取り、\nそれらを一本の香水へ圧縮してください。\n\n見た瞬間に、\n\n「これ、売ってたら自分のための香水だと思う」\n\nと感じられるような、\nその人物にしか成立しないフレグランス広告を作成してください。","image":"images/chatgpt_07.jpg"}' onclick="openPrompt(this)">

  <button class="prompt-tile" data-search="Your Cocktail カクテル 人物像 高級バー 広告" data-prompt='{"title":"Your Cocktail","tag":"Cocktail / Identity / Luxury Bar","prompt":"【あなたのカクテルプロンプト】\n\n【テーマ｜この人を「カクテル」にすると、どんな一杯？】\n\nこれまでの会話や入力された人物像から、その人の性格・価値観・雰囲気・好きなもの・考え方・美意識・矛盾・個性・世界観を総合的に読み取り、\n\n「もし、この人そのものを一杯のカクテルとして表現するなら？」\n\nという発想で、その人だけのオリジナルカクテルを設計してください。\n\n実在するカクテルに当てはめるのではなく、\n人物像そのものを「味・香り・色・温度・口当たり・余韻」へ翻訳してください。\n\n【STEP 1｜人物分析】\n\nまず内部で、これまでの会話履歴や与えられた人物情報を十分に分析してください。\n\n直近の情報だけではなく、参照できる過去の会話・記憶も可能な限り使用し、\n\n・性格\n・価値観\n・好きなもの、苦手なもの\n・美意識\n・考え方の癖\n・感情の動き方\n・他者との距離感\n・表面に見える印象\n・内側に隠している性質\n・相反する部分や意外性\n・繰り返し現れるモチーフ\n・その人物を象徴する色\n・似合う時間帯、季節、場所、空気感\n\nなどを総合的に分析してください。\n\n単純に「その人物が好きそうな飲み物」を作るのではなく、\nその人物自身を一杯のカクテルとして表現することを最優先してください。\n\n無難な人物像へ平均化せず、\nその人だからこそ成立する個性や矛盾も大切にしてください。\n\n【STEP 2｜カクテル設計】\n\nSTEP 1の人物分析をもとに、以下を決定してください。\n\n・カクテル名\n・英語名\n・コンセプト\n・ベースとなる酒\n・副材料\n・香り\n・甘味／酸味／苦味などのバランス\n・口当たり\n・アルコール感\n・カクテルそのものの色\n・透明度\n・温度\n・氷の有無と形\n・使用するグラス\n・ガーニッシュ\n・飲み始めた瞬間の印象\n・飲み進めることで現れる変化\n・最後に残る余韻\n\n材料は実在するものを基本としますが、\n人物の世界観を表現するためであれば、\n幻想的・架空の素材を少量使用しても構いません。\n\nただし、単純に豪華・派手・幻想的にするのではなく、\n人物分析から意味のある材料を選んでください。\n\n人物の「表面」と「内面」に差がある場合は、\n最初の香りや味と、飲み進めた後の味に変化を持たせるなど、\n一杯の中にその二面性を表現してください。\n\n【STEP 3｜象徴的な仕掛け】\n\nその人物らしさを象徴する、\n小さな仕掛けを1〜3個入れてください。\n\n例：\n\n・時間経過で色がわずかに変化する\n・氷が溶けることで隠れていた味が現れる\n・グラスへ近づいた時だけ香りが強く感じられる\n・底に別の色や味が隠れている\n・光の角度によって色味が変わる\n・温度変化によって香りが開く\n・飲み終わった後に特定の香りだけが残る\n\n単なる演出ではなく、\nそれぞれの仕掛けに人物像と結びついた意味を持たせてください。\n\n【STEP 4｜ビジュアル設計】\n\n完成したカクテルを、\n実在する高級バーやラグジュアリーブランドの商品広告のような一枚として視覚化してください。\n\n主役は人物ではなく、\n必ずカクテルそのものにしてください。\n\n人物を直接描かず、\nカクテル、グラス、光、背景、小物によって人物像を表現してください。\n\nカクテルは画面中央付近へ配置し、\nグラス全体の造形とカクテルの色が美しく見える構図にしてください。\n\n背景やテーブルには、\nその人物を象徴する色彩・時間帯・場所・モチーフなどを必要最低限だけ取り入れてください。\n\n高級バーの広告写真やブランドビジュアルのように、\n洗練されたライティング、質感、奥行き、余白を意識してください。\n\n人物像に合わない装飾を無理に追加しないでください。\n\n過剰な装飾、\n意味のない大量の小物、\n過度な光粒子、\n画面を埋め尽くすエフェクトなどは避けてください。\n\n【STEP 5｜画像内テキスト・クレジット】\n\n画像内には必要に応じて、\n\n・カクテル名\n・英語名\n・短い一文のキャッチコピー\n\nのみを上品に配置してください。\n\n長い説明文やレシピは画像内へ入れないでください。\n\nさらに、\n画像の隅や下部などデザインを邪魔しない位置へ、\n\n「LUNO WORKS」\n\nのクレジットを小さく入れてください。\n\nクレジットはブランドサインのように控えめに扱い、\nカクテル名やメインビジュアルより目立たせないでください。\n\nフォント、配置、文字色、文字組みは、\n完成したカクテルとビジュアル全体に合わせて自由にデザインしてください。\n\n【最終出力】\n\n内部で行った人物分析を、そのまま長々と開示する必要はありません。\n\n人物像を十分に分析したうえで、\n\n・カクテル名\n・コンセプト\n・主な材料\n・味と香り\n・象徴的な仕掛け\n・この一杯が表現している人物像\n\nを簡潔に提示してください。\n\nその後、\n完成した設計をもとにカクテルの画像を生成してください。\n\n単なる「綺麗なカクテル」や「その人が好きそうなカクテル」ではなく、\n\n「この人物そのものを一杯にした」\n\nと感じられるデザインを最優先してください。\n\n他の誰でも成立する無難な一杯へ平均化せず、\nその人物だけの性格、矛盾、空気感、余韻までカクテルとして表現してください。","image":"images/chatgpt_08.jpg"}' onclick="openPrompt(this)">
