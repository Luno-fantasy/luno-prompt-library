<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3eee8">
<title>ChatGPT Image Prompts | Luno</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
<header class="site-head">
  <a class="brand" href="index.html">LUNO</a>
  <a class="head-link" href="index.html">COLLECTIONS</a>
</header>

<a class="back" href="index.html">Collections</a>
<section class="collection-hero">
  <span class="eyebrow">AI Image Collection</span>
  <h1>ChatGPT<br>Image Prompts</h1>
  <p>ChatGPTの画像生成で使うプロンプトと作例をまとめるコレクション。</p>
</section>

<div class="toolbar">
  <input class="search" type="search" placeholder="タイトル・テーマ・雰囲気から検索" oninput="filterTiles(this)">
</div>

<section class="gallery"></section>
<div class="empty" id="emptyState" style="display:block">プロンプトはここに追加していきます。</div>

<footer class="footer">LUNO PROMPT ARCHIVE — PRIVATE COLLECTION</footer>
</main>

<div class="modal" id="promptModal">
  <div class="modal-backdrop" onclick="closePrompt()"></div>
  <section class="modal-sheet">
    <div class="modal-grip"></div>
    <button class="modal-close" onclick="closePrompt()" aria-label="閉じる">×</button>
    <div class="modal-image-wrap"><img class="modal-image" id="modalImage" alt=""></div>
    <div class="modal-sub" id="modalSub"></div>
    <h2 id="modalTitle"></h2>
    <div class="gender-tabs" id="genderTabs"></div>

    <div class="quality-label">Prompt</div>
    <div class="prompt-box" id="promptText"></div>
    <button class="copy" id="copyButton" onclick="copyPrompt()">Promptをコピー</button>

    <div class="quality-section" id="qualitySection">
      <div class="quality-label">Quality Tags</div>
      <div class="prompt-box" id="qualityText"></div>
      <button class="copy-secondary" id="qualityCopyButton" onclick="copyQualityTags()">品質タグをコピー</button>
    </div>

    <div class="quality-section" id="negativeSection">
      <div class="quality-label">Negative Prompt</div>
      <div class="prompt-box" id="negativeText"></div>
      <button class="copy-secondary" id="negativeCopyButton" onclick="copyNegativeTags()">ネガティブをコピー</button>
    </div>
  </section>
</div>

<script src="app.js"></script>
</body>
</html>
